<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>trickle scenario</title></head>
<body style="background:#111;color:#ccc;margin:8px;font:12px monospace"><pre id="out">running...</pre>
<script type="module">
import { createHarness, blankGrid, fill, T, makeCell, W, H, plantE, makePlant } from './harness.js';
// A thick stone basin of water drains through a 1px channel down a long funnel,
// a thin trickle onto one end of an established plant on a stone shelf. The
// shelf slopes gently down to the left, so runoff flows away from the plant and
// off the shelf's edge onto the floor, where it keeps being erased (like a
// player clearing it): the plant is watered, not flooded. A sand pile sits at
// the shelf's far right end. Success is the plant spreading along the shelf
// toward the sand rather than climbing the trickle.
const h = await createHarness();
const g = blankGrid();
const STONE = makeCell(T.STONE, 0, 0), WATER = makeCell(T.WATER, 0, 0), SAND = makeCell(T.SAND, 0, 0);
const CX = 155, NECK = 175, SAND_X = 215, SHELF_X = 110;
const top = x => Math.round(92 + 22 * Math.sin(Math.PI * (x - 10) / 200));  // basin floor, sagging in the middle
const ground = x => H - 30 + Math.round((W - 2 - x) / 12);                   // shelf top
for (let x = 1; x < W - 1; x++) {
  fill(g, x, x + 1, 35, top(x), WATER);
  fill(g, x, x + 1, top(x), top(x) + 34, STONE);
  // funnel: a wedge narrowing down to the neck
  const half = Math.abs(x - CX), y0 = top(x) + 34, y1 = Math.round(NECK - half * 1.6);
  if (y1 > y0) fill(g, x, x + 1, y0, y1, STONE);
  if (x >= SHELF_X) fill(g, x, x + 1, ground(x), H - 1, STONE);
  if (x >= SAND_X) fill(g, x, x + 1, ground(x) - Math.round((x - SAND_X) * 0.8), ground(x), SAND);
}
fill(g, CX, CX + 1, top(CX), NECK, 0);                                   // the channel
// an established plant under the neck: a big rough clump stretching right from
// where the drip lands, half full
const mom = new Uint32Array(2 * W * H);
const P0 = CX - 16, P1 = CX + 44;
for (let x = P0; x <= P1; x++) {
  const ht = Math.round(20 * Math.sqrt(1 - ((2 * x - P0 - P1) / (P1 - P0 + 2)) ** 2) + 3 * Math.sin(x * 1.7));
  for (let y = ground(x) - ht; y < ground(x); y++) { g[y * W + x] = makePlant(20, (x * 7 + y * 13) & 3); mom[2 * (y * W + x) + 1] = 255; }
}
h.load(g, mom);
const sump = step => { if (step % 30 === 0) h.brush({ x0: 1, y0: H - 4, x1: SHELF_X - 4, y1: H - 4, r: 3, type: T.EMPTY }); };

const stats = (a, m) => {
  let p = 0, e = 0, wet = 0, x0 = W, x1 = 0, y0 = H, near = 0, nd = 0;
  a.forEach((c, i) => {
    const x = i % W, y = (i / W) | 0, t = c & 255;
    if (t === T.WATER && y > NECK && x >= SHELF_X) wet++;
    if (t !== T.PLANT) return;
    p++; e += plantE(c); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y);
    if ((m[2 * i + 1] & 255) <= 6) near++;
  });
  return `plant ${String(p).padStart(4)} avgE ${String(p ? Math.round(e / p) : 0).padStart(2)} | spans x ${p ? x0 : '-'}..${p ? x1 : '-'} (sand at ${SAND_X}) top y ${p ? y0 : '-'} (neck ${NECK}) | within 3 cells of water ${near} | loose water on the shelf ${wet}`;
};
await h.snapshot(stats, { mom: true });
for (const t of [5, 15, 30, 60, 100, 180]) { h.run(t * 180 - h.step, sump); await h.snapshot(stats, { mom: true }); }
h.finish('trickle: a 1px channel drips onto one end of an established plant on a shelf draining left, sand at the far end');
</script></body></html>
