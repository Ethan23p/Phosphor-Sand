<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>dist scenario</title></head>
<body style="background:#111;color:#ccc;margin:8px;font:12px monospace"><pre id="out">running...</pre>
<script type="module">
import { createHarness, blankGrid, fill, T, makeCell, W, H, makePlant, plantE } from './harness.js';
// Root distance under a complex growth front. A splotchy block of plant (holes
// and a ragged top) sits in a stone tray (walls left, right and below) with a
// pool of water on top. A 1px notch in the right wall lets the pool drain off
// slowly into a shaft beside it. Every plant starts at the distance cap, so the
// distance field has to build itself from where the plant drinks.
// The third row of the strip shows the stored root distance (white at 0, through
// yellow and red to blue at 40 cells; magenta at the cap); the fourth the true
// shortest distance through the plant to a cell touching water, on the same
// scale. Stats compare the two. The stored distance counts from where a cell
// last drank, so condensed transpiration in a hole also resets it: "too low"
// there is the sim working as written, not a propagation error.
const h = await createHarness();
const g = blankGrid(), mom = new Uint32Array(2 * W * H);
const STONE = makeCell(T.STONE, 0, 0), WATER = makeCell(T.WATER, 0, 0);
const CAP = 255, X0 = 40, X1 = 216, WALL = 6, FLOOR = 230, RIM = 60, POOL = 100, NOTCH = 137;
const hash = (x, y) => { let n = (x * 374761393 + y * 668265263) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
const vnoise = (x, y, s) => {
  const fx = x / s, fy = y / s, ix = Math.floor(fx), iy = Math.floor(fy), u = fx - ix, v = fy - iy;
  const a = hash(ix, iy), b = hash(ix + 1, iy), c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
  const su = u * u * (3 - 2 * u), sv = v * v * (3 - 2 * v);
  return a + (b - a) * su + (c - a) * sv + (a - b - c + d) * su * sv;
};
const top = x => Math.round(140 + 8 * (vnoise(x, 0, 14) - 0.5) * 2); // ragged top edge

fill(g, 0, W, 0, H, STONE);
fill(g, 1, W - 1, 1, RIM, 0);                        // open sky above the tray
fill(g, X0, X1, RIM, FLOOR, 0);                      // the tray
fill(g, X1 + WALL, W - 1, RIM, H - 1, 0);            // drain shaft beside it
fill(g, X1, X1 + WALL, NOTCH, NOTCH + 1, 0);         // the notch it drains through
for (let y = 120; y < FLOOR; y++) for (let x = X0; x < X1; x++) {
  const i = y * W + x;
  if (y < top(x)) { if (y >= POOL) g[i] = WATER; continue; }
  if (0.6 * vnoise(x, y, 11) + 0.4 * vnoise(x + 99, y, 4) < 0.36) continue; // holes
  g[i] = makePlant(20, (x * 7 + y * 13) & 3);
  mom[2 * i + 1] = CAP;
}
fill(g, X0, X1, POOL, 120, WATER);
h.load(g, mom);

const N8 = [[1, 0, 2], [-1, 0, 2], [0, 1, 2], [0, -1, 2], [1, 1, 3], [1, -1, 3], [-1, 1, 3], [-1, -1, 3]];
// True root distance: shortest path through plant (orthogonal 2, diagonal 3) to a
// plant cell touching water, capped like the sim
function truth(a) {
  const d = new Uint16Array(W * H).fill(CAP), buckets = Array.from({ length: CAP + 1 }, () => []);
  const isP = i => (a[i] & 255) === T.PLANT;
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    if (isP(i) && N8.some(([dx, dy]) => (a[i + dy * W + dx] & 255) === T.WATER)) { d[i] = 0; buckets[0].push(i); }
  }
  for (let k = 0; k <= CAP; k++) for (const i of buckets[k]) {
    if (d[i] !== k) continue;
    for (const [dx, dy, c] of N8) {
      const j = i + dy * W + dx, nk = k + c;
      if (nk < CAP && isP(j) && nk < d[j]) { d[j] = nk; buckets[nk].push(j); }
    }
  }
  return d;
}

const snaps = [];
const stats = (a, m) => {
  const t = truth(a);
  let n = 0, w = 0, st = 0, err = 0, low = 0, high = 0, capped = 0, tips = 0, tipD = 0, tipT = 0, e = 0;
  for (let i = 0; i < W * H; i++) {
    const ty = a[i] & 255;
    if (ty === T.WATER) w++;
    if (ty === T.STEAM) st++;
    if (ty !== T.PLANT) continue;
    const s = m[2 * i + 1], tr = t[i];
    n++; e += plantE(a[i]); err += Math.abs(s - tr);
    if (s + 6 < tr) low++;
    if (s > tr + 6) high++;
    if (s >= CAP) capped++;
    if (N8.slice(0, 4).some(([dx, dy]) => (a[i + dy * W + dx] & 255) === T.EMPTY)) { tips++; tipD += s; tipT += tr; }
  }
  snaps.push({ a, m, t });
  const pc = k => `${(100 * k / n).toFixed(0)}%`;
  return `plant ${n} avgE ${(e / n).toFixed(0)} water ${w} steam ${st} | stored vs true: mean err ${(err / n / 2).toFixed(1)} cells, too low ${pc(low)}, too high ${pc(high)}, capped ${pc(capped)} | air edge: stored ${(tipD / tips / 2).toFixed(1)} true ${(tipT / tips / 2).toFixed(1)} cells`;
};
await h.snapshot(stats, { mom: true });
for (const s of [45, 90, 180, 360, 720, 1440, 2880, 5400]) { h.run(s - h.step); await h.snapshot(stats, { mom: true }); }
h.finish('dist: splotchy plant in a stone tray under a slowly draining pool, every plant starting at the distance cap');

// Two more rows: stored root distance, then the true one
const old = document.getElementById('cv'), S = 2, cv = document.createElement('canvas');
cv.width = old.width; cv.height = old.height + 2 * (H * S + 4);
const ctx = cv.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(old, 0, 0);
const ramp = v => v >= CAP ? [255, 0, 255] : (v = Math.min(v / 80, 1), v < 0.33 ? [255, 255, 255 * (1 - v * 3)] : v < 0.66 ? [255, 255 * (1 - (v - 0.33) * 3), 0] : [255 * (1 - (v - 0.66) * 3), 0, 255 * (v - 0.66) * 3]);
const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H; ctx.imageSmoothingEnabled = false;
snaps.forEach(({ a, m, t }, k) => [0, 1].forEach(row => {
  const img = tmp.getContext('2d').createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    const o = i * 4, plant = (a[i] & 255) === T.PLANT;
    const c = plant ? ramp(row ? t[i] : m[2 * i + 1]) : [20, 20, 20];
    img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
  }
  tmp.getContext('2d').putImageData(img, 0, 0);
  ctx.drawImage(tmp, k * (W * S + 4), old.height + 4 + row * (H * S + 4), W * S, H * S);
}));
old.replaceWith(cv); cv.id = 'cv';
</script></body></html>
