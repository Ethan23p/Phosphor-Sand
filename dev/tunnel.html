<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>tunnel scenario</title></head>
<body style="background:#111;color:#ccc;margin:8px;font:12px monospace"><pre id="out">running...</pre>
<script type="module">
import { createHarness, blankGrid, fill, T, makeCell, W, stats } from './harness.js';
// Water in the left chamber, a stem through a stone tunnel, one tip in the right chamber.
// Expect: the pool drains while growth happens only on the far side.
const h = await createHarness();
const g = blankGrid().fill(makeCell(T.STONE, 0, 0));
fill(g, 10, 70, 60, 140, 0);                          // left chamber
fill(g, 10, 70, 100, 140, makeCell(T.WATER, 0, 0));   // pool
fill(g, 70, 190, 76, 81, 0);                          // tunnel
fill(g, 190, 250, 20, 140, 0);                        // right chamber
const DOWN = 4 << 3, LEFT = 1 << 3;                   // parent-link codes
g[139 * W + 40] = makeCell(T.PLANT, 30, 0);                                  // root at the pool floor
for (let y = 78; y < 139; y++) g[y * W + 40] = makeCell(T.PLANT, 30, DOWN);  // up out of the pool
for (let x = 41; x < 196; x++) g[78 * W + x] = makeCell(T.PLANT, 30, LEFT);  // through the tunnel
g[78 * W + 196] = makeCell(T.PLANT, 30, 4 | LEFT);                           // single tip
h.load(g);
const regions = a => {
  let water = 0, near = 0, far = 0, tips = 0;
  a.forEach((c, i) => { const t = c & 255; if (t === T.WATER) water++;
    if (t === T.PLANT) { (i % W < 190 ? near++ : far++); if ((c >> 16) & 4) tips++; } });
  return `water ${water} | plant near/tunnel ${near} | plant far chamber ${far} | tips ${tips}`;
};
await h.snapshot(regions);
for (const t of [1800, 4500, 9000, 18000]) { h.run(t - h.step); await h.snapshot(regions); }
h.finish('tunnel: water at one end, growth at the other');
</script></body></html>
