<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>reservoir scenario</title></head>
<body style="background:#111;color:#ccc;margin:8px;font:12px monospace"><pre id="out">running...</pre>
<script type="module">
import { createHarness, blankGrid, fill, T, makeCell, W, plantE } from './harness.js';
// A stone bowl of water drains through a hole in its bottom onto seeds on the
// floor below. Two variants side by side:
//   left  (open): the seeds sit on the open floor.
//   right (neck): the seeds sit in a stone cup; water drips in through a gap in
//   its roof, and the only other way out is a 2-cell slit at the floor, so growth
//   outside has to be fed through a bottleneck.
// Each floor stops short of a gap at its sides, and water that reaches a gap
// drains into a sump that keeps being erased, as does a 1px drain in the
// cup's floor (the slit alone can't keep up), so the seeds aren't drowned.
const h = await createHarness();
const g = blankGrid();
const STONE = makeCell(T.STONE, 0, 0), WATER = makeCell(T.WATER, 0, 0);
fill(g, 12, 116, 240, 250, STONE);                           // floors, with drain gaps
fill(g, 129, W - 12, 240, 250, STONE);                       //   at their sides
fill(g, 127, 129, 0, 256, STONE);                            // divider between variants
const HOLE = 42, CUP = [0, 60, 200, 240];                     // x offsets within a half
for (const ox of [0, 129]) {
  fill(g, ox + 10, ox + 118, 30, 101, STONE);                // bowl
  fill(g, ox + 16, ox + 112, 30, 95, WATER);                 // the water in it
  fill(g, ox + HOLE, ox + HOLE + 1, 95, 101, 0);             // 1px hole in the bottom
  const end = ox ? 196 : 190;                                 // a straw down to the seeds (or the cup's roof gap),
  fill(g, ox + HOLE - 1, ox + HOLE + 2, 101, end, STONE);     //   so the stream lands narrow instead of spraying
  fill(g, ox + HOLE, ox + HOLE + 1, 101, end, 0);
}
const N0 = 129;
const [cx0, cx1, cy0, cy1] = CUP.map((v, k) => k < 2 ? v + N0 : v);
fill(g, cx0, cx1, cy0, cy1, STONE);                          // cup
fill(g, cx0 + 3, cx1 - 3, cy0 + 3, cy1, 0);                  // its inside
fill(g, N0 + HOLE - 1, N0 + HOLE + 5, cy0, cy0 + 3, 0);      // roof gap under the hole
fill(g, cx1 - 3, cx1, cy1 - 2, cy1, 0);                      // 2-cell slit out at the floor
fill(g, cx0 + 3, cx0 + 4, cy1, 250, 0);                       // 1px drain in its floor, far from the seeds
// a stone ramp on the roof from the gap to the cup's outer edge, sloping
// back into the gap, so no water spills down the outside to the slit
for (let x = N0 + HOLE + 5; x < cx1; x++) fill(g, x, x + 1, cy0 - 2 - ((x - N0 - HOLE - 5) >> 1), cy0, STONE);
h.load(g);
for (const ox of [0, N0]) h.brush({ x0: ox + 34, y0: 237, x1: ox + 54, y1: 237, r: 2, type: T.SEED, density: 60 });

const inCup = (x, y) => x >= cx0 && x < cx1 && y >= cy0 && y < cy1;
const regions = a => {
  const s = [{ w: 0, p: 0, e: 0, out: 0, up: 0 }, { w: 0, p: 0, e: 0, out: 0, up: 0 }];
  a.forEach((c, i) => {
    const x = i % W, y = (i / W) | 0, side = s[x < 128 ? 0 : 1], t = c & 255;
    if (t === T.WATER) side.w++;
    if (t === T.PLANT) { side.p++; side.e += plantE(c); if (x >= 128 && !inCup(x, y)) side[y < cy0 ? 'up' : 'out']++; }
  });
  const f = (v, k) => `water ${String(v.w).padStart(4)} plant ${String(v.p).padStart(4)} avgE ${String(v.p ? Math.round(v.e / v.p) : 0).padStart(3)}` + (k ? ` | out the slit ${v.out} above the roof ${v.up}` : '');
  return `open: ${f(s[0], 0)} || neck: ${f(s[1], 1)}`;
};
await h.snapshot(regions, { mom: true });
const sump = step => { if (step % 30 === 0) h.brush({ x0: 1, y0: 252, x1: W - 2, y1: 252, r: 3, type: T.EMPTY }); };
for (const t of [5, 15, 30, 60, 100, 180]) { h.run(t * 180 - h.step, sump); await h.snapshot(regions, { mom: true }); }
h.finish('reservoir: a bowl drains onto seeds; left open, right through a cup with a 2-cell slit');
</script></body></html>
