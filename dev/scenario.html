<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>scenario</title></head>
<body style="background:#111;color:#ccc;margin:8px;font:12px monospace">
<!-- Generic scenario page: /dev/scenario.html?s=<name>&v=<variant>&TUNING_NAME=value...
     Loads dev/scenarios/<name>.js and runs it (see dev/scenario.js). -->
<div id="report" style="display:inline-block;padding:8px;background:#111"><div id="head"></div><div id="strip"></div><pre id="out">running...</pre></div>
<script type="module">
import { runScenario } from './scenario.js';
runScenario().catch(e => { document.getElementById('out').textContent = 'ERROR ' + e.message + '\n' + e.stack; console.log('ERROR ' + e.message); });
</script></body></html>
