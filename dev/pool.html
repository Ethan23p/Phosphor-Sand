<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>pool scenario</title></head>
<body style="background:#111;color:#ccc;margin:8px;font:12px monospace"><pre id="out">running...</pre>
<script type="module">
import { createHarness, blankGrid, fill, T, makeCell, W, stats } from './harness.js';
// Seeds dropped into a pool on a floor. Expect: seedlings grow up through and out of the water.
const h = await createHarness();
const g = blankGrid();
fill(g, 20, 236, 200, 206, makeCell(T.STONE, 0, 0));
fill(g, 20, 26, 170, 200, makeCell(T.STONE, 0, 0)); fill(g, 130, 136, 170, 200, makeCell(T.STONE, 0, 0));
fill(g, 26, 130, 180, 200, makeCell(T.WATER, 0, 0));
fill(g, 70, 76, 150, 152, makeCell(T.SEED, 0, 0));
h.load(g);
await h.snapshot();
for (const t of [900, 2700, 5400, 10800, 18000]) { h.run(t - h.step); await h.snapshot(); }
h.finish('pool: seeds in standing water');
</script></body></html>
