<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phosphor Sand</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="error">
  <h2>// WebGPU not available</h2>
  <p>This simulation requires WebGPU (Chrome 113+, Edge 113+, Safari 18+).</p>
</div>

<div id="app" style="display:none">
  <div id="canvas-wrap">
    <canvas id="canvas" width="256" height="256"></canvas>
    <div id="sim-error-banner"></div>
  </div>
  <div id="toolbar">
    <div class="tool-group" id="particle-tools">
      <label>Draw</label>
      <!-- buttons generated from TOOLS in src/config.js -->
    </div>
    <div class="tool-group">
      <label>Size</label>
      <input type="range" id="brush-size" min="1" max="12">
    </div>
    <div class="tool-group">
      <label>Speed</label>
      <input type="range" id="sim-speed" min="1" max="8">
    </div>
    <div class="tool-group">
      <label>React</label>
      <input type="range" id="react-rate" min="2" max="16">
    </div>
    <div class="tool-group">
      <button class="ctrl-btn" id="btn-pause">⏸</button>
      <button class="ctrl-btn" id="btn-clear">Clear</button>
    </div>
  </div>
  <div id="pipeline-status">
    <span><span id="h-sim" class="health"></span>SIM</span>
    <span><span id="h-ren" class="health"></span>RENDER</span>
  </div>
  <div id="status"></div>
  <div id="debug-log" class="ok"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
