<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phosphor Sand</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1a1920; --surface: #252330; --border: #3a3848;
    --text: #8dd894; --text-dim: #5d4776; --glow: #5efdf7;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh;
    overflow: hidden; padding: 8px;
  }
  #error {
    display: none; color: #f3a787; text-align: center;
    padding: 2em; max-width: 500px; line-height: 1.6;
  }
  #error h2 { color: #ff5dcc; margin-bottom: 0.5em; font-size: 1.1em; }
  #app { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #canvas-wrap {
    position: relative; border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 0 30px rgba(94,253,247,0.06), 0 0 60px rgba(94,253,247,0.03),
      inset 0 0 20px rgba(0,0,0,0.3);
  }
  canvas {
    display: block;
    width: min(80vw, 80vh, 560px); height: min(80vw, 80vh, 560px);
    image-rendering: pixelated; image-rendering: crisp-edges;
    cursor: crosshair;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #canvas-wrap::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.35) 100%);
    border-radius: 6px;
  }

  /* Error banner overlay on canvas */
  #sim-error-banner {
    display: none;
    position: absolute; bottom: 8px; left: 8px; right: 8px;
    background: rgba(50, 20, 30, 0.92);
    border: 1px solid #ff5dcc;
    border-radius: 4px; padding: 8px 10px;
    font-size: 10px; color: #f3a787;
    line-height: 1.4; z-index: 10;
    max-height: 80px; overflow-y: auto;
  }
  #sim-error-banner .err-title {
    color: #ff5dcc; font-weight: 600; margin-bottom: 2px;
  }

  #toolbar {
    display: flex; flex-wrap: wrap; gap: 6px;
    align-items: center; justify-content: center; max-width: 560px;
  }
  .tool-group {
    display: flex; gap: 3px; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 6px;
  }
  .tool-group label {
    font-size: 10px; color: var(--text-dim); margin-right: 4px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .particle-btn {
    width: 28px; height: 28px; border: 2px solid transparent;
    border-radius: 4px; cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    background: var(--surface);
  }
  .particle-btn:hover { border-color: var(--text-dim); }
  .particle-btn.active {
    border-color: var(--glow);
    box-shadow: 0 0 8px rgba(94,253,247,0.3);
  }
  .particle-btn .swatch {
    display: block; width: 100%; height: 100%; border-radius: 2px;
  }
  .ctrl-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: inherit; font-size: 11px;
    padding: 4px 10px; border-radius: 4px; cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .ctrl-btn:hover { border-color: var(--text); color: var(--glow); }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 70px; height: 4px; background: var(--border);
    border-radius: 2px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    background: var(--text); border-radius: 50%; cursor: pointer;
  }
  /* Pipeline health indicators */
  .health { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 3px; }
  .health.ok { background: #8dd894; box-shadow: 0 0 4px #8dd894; }
  .health.fail { background: #ff5dcc; box-shadow: 0 0 4px #ff5dcc; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  #status {
    font-size: 10px; color: var(--text-dim); text-align: center;
    min-height: 14px; line-height: 14px; max-width: 560px;
  }
  #pipeline-status {
    font-size: 9px; color: var(--text-dim); display: flex;
    gap: 10px; justify-content: center; align-items: center;
  }
  #debug-log {
    font-size: 9px; color: var(--text-dim); text-align: left;
    max-width: 560px; width: 100%; max-height: 80px; overflow-y: auto;
    padding: 4px; background: rgba(0,0,0,0.3); border-radius: 4px;
    margin-top: 4px; white-space: pre-wrap; word-break: break-all;
  }
  #debug-log.err { border-left: 2px solid #ff5dcc; }
  #debug-log.ok { border-left: 2px solid #8dd894; }
</style>
</head>
<body>

<div id="error">
  <h2>// WebGPU not available</h2>
  <p>This simulation requires WebGPU (Chrome 113+, Edge 113+, Safari 18+).</p>
</div>

<div id="app" style="display:none">
  <div id="canvas-wrap">
    <canvas id="canvas" width="256" height="256"></canvas>
    <div id="sim-error-banner"></div>
  </div>
  <div id="toolbar">
    <div class="tool-group">
      <label>Draw</label>
      <button class="particle-btn active" data-type="1" title="Sand"><span class="swatch" style="background:#f5daa7"></span></button>
      <button class="particle-btn" data-type="2" title="Water"><span class="swatch" style="background:#5fc9e7"></span></button>
      <button class="particle-btn" data-type="3" title="Stone"><span class="swatch" style="background:#444774"></span></button>
      <button class="particle-btn" data-type="4" title="Fire"><span class="swatch" style="background:#fdfe89"></span></button>
      <button class="particle-btn" data-type="7" title="Seed"><span class="swatch" style="background:#ab58a8"></span></button>
      <button class="particle-btn" data-type="8" title="Ember"><span class="swatch" style="background:#f3a787"></span></button>
      <button class="particle-btn" data-type="0" title="Eraser"><span class="swatch" style="background:#32313b; border:1px solid #3a3848"></span></button>
    </div>
    <div class="tool-group">
      <label>Size</label>
      <input type="range" id="brush-size" min="1" max="12" value="3">
    </div>
    <div class="tool-group">
      <label>Speed</label>
      <input type="range" id="sim-speed" min="1" max="8" value="3">
    </div>
    <div class="tool-group">
      <label>React</label>
      <input type="range" id="react-rate" min="2" max="16" value="8">
    </div>
    <div class="tool-group">
      <button class="ctrl-btn" id="btn-pause">⏸</button>
      <button class="ctrl-btn" id="btn-clear">Clear</button>
    </div>
  </div>
  <div id="pipeline-status">
    <span><span id="h-sim" class="health"></span>SIM</span>
    <span><span id="h-ren" class="health"></span>RENDER</span>
  </div>
  <div id="status"></div>
  <div id="debug-log" class="ok"></div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  DEBUG & VALIDATION INFRASTRUCTURE
// ══════════════════════════════════════════════════════
const debugEl = document.getElementById('debug-log');
const logs = [];
function dbg(msg, isErr) {
  const t = (performance.now()/1000).toFixed(2);
  logs.push(`[${t}] ${msg}`);
  if (logs.length > 40) logs.shift();
  if (debugEl) {
    debugEl.textContent = logs.join('\n');
    if (isErr) debugEl.className = 'err';
    debugEl.scrollTop = debugEl.scrollHeight;
  }
  isErr ? console.error(msg) : console.log(msg);
}

function showSimError(errors) {
  const banner = document.getElementById('sim-error-banner');
  banner.style.display = 'block';
  banner.innerHTML = `<div class="err-title">⚠ Simulation shader error</div>` +
    errors.map(e => `<div>${e}</div>`).join('') +
    `<div style="margin-top:4px;color:#5d4776">Drawing works, but particles won't move.</div>`;
}

function setHealth(id, ok) {
  const el = document.getElementById(id);
  el.className = ok ? 'health ok' : 'health fail';
}

// ══════════════════════════════════════════════════════
//  WGSL PRE-VALIDATOR
//  Catches common issues before they hit the GPU compiler
// ══════════════════════════════════════════════════════
function validateWGSL(code, label) {
  const issues = [];

  // 1. Reserved keywords used as identifiers
  const reserved = [
    'target','texture','sampler','NULL','Self','abstract','active','alignas','alignof',
    'as','asm','async','auto','await','become','binding_array','cast','catch','class',
    'co_await','co_return','co_yield','concept','const_cast','consteval','constexpr',
    'constinit','crate','decltype','delegate','delete','dynamic_cast','enum','explicit',
    'export','extends','extern','final','friend','from','get','goto','handle','implements',
    'import','in','inline','instanceof','interface','layout','macro','macro_rules','match',
    'module','move','mut','mutable','namespace','new','nil','noexcept','noinline','nointerface',
    'nothrow','null','nullptr','of','operator','package','partial','pass','patch','priv',
    'protected','pub','reinterpret_cast','require','requires','resource','restrict','self',
    'set','sizeof','static_assert','static_cast','super','template','this','thread_local',
    'throw','trait','try','type','typedef','typeid','typename','typeof','union','unless',
    'unsafe','unsized','use','using','virtual','volatile','wgsl','where','with','yield'
  ];
  const identPattern = /\b([a-zA-Z_][a-zA-Z0-9_]*)\s*[:=(,)]/g;
  const fnParamPattern = /fn\s+\w+\(([^)]*)\)/g;
  let fnMatch;
  while ((fnMatch = fnParamPattern.exec(code)) !== null) {
    const params = fnMatch[1];
    for (const rw of reserved) {
      // Check if reserved word is used as parameter name
      const paramRegex = new RegExp(`\\b${rw}\\s*:`);
      if (paramRegex.test(params)) {
        issues.push({
          severity: 'error',
          msg: `'${rw}' is a WGSL reserved keyword, used as parameter near: ${fnMatch[0].substring(0, 60)}`
        });
      }
    }
  }

  // 2. Signed shift: >> or << with i32 RHS (WGSL requires u32 RHS for shifts)
  // Match patterns like >>1i, >>varname where varname was declared as i32
  const signedShiftLiteral = />>\s*\d+i\b|<<\s*\d+i\b/g;
  let shiftMatch;
  while ((shiftMatch = signedShiftLiteral.exec(code)) !== null) {
    const lineNum = code.substring(0, shiftMatch.index).split('\n').length;
    issues.push({
      severity: 'error',
      msg: `Signed shift RHS at line ${lineNum}: '${shiftMatch[0]}'. WGSL requires u32 for shift amounts.`
    });
  }

  // 3. Bare integer literals (e.g., just '1' or '2') in arithmetic with typed expressions
  //    This is a warning — abstract ints are fine in some contexts but risky
  // (Skipped — too many false positives)

  // 4. Check for undefined variable references (basic: used but never let/var declared)
  // Simple heuristic: find all let/var declarations and check common undefined patterns
  // This is intentionally lightweight — the GPU compiler does the real check
  const declared = new Set();
  const declPattern = /(?:let|var)\s+([a-zA-Z_]\w*)/g;
  let declMatch;
  while ((declMatch = declPattern.exec(code)) !== null) {
    declared.add(declMatch[1]);
  }
  // Also add function parameters
  const paramPattern2 = /fn\s+\w+\(([^)]*)\)/g;
  let pm2;
  while ((pm2 = paramPattern2.exec(code)) !== null) {
    const params = pm2[1].split(',');
    for (const p of params) {
      const name = p.trim().split(':')[0]?.trim();
      if (name) declared.add(name);
    }
  }
  // Also add struct fields, builtins, and function names
  const fnNamePattern = /fn\s+(\w+)/g;
  let fnm;
  while ((fnm = fnNamePattern.exec(code)) !== null) declared.add(fnm[1]);

  // 5. Check for common type mismatches in operations
  // vec3u vs vec3<u32> — both fine, but mixing i32 and u32 ops is caught
  // This is best left to the compiler, so just log a note
  
  // Report
  for (const issue of issues) {
    dbg(`[WGSL-LINT:${label}] ${issue.severity}: ${issue.msg}`, issue.severity === 'error');
  }
  if (issues.length === 0) {
    dbg(`[WGSL-LINT:${label}] passed (${code.split('\n').length} lines)`);
  }
  return issues;
}

// GPU-level shader compilation check
async function checkShader(device, mod, label) {
  const info = await mod.getCompilationInfo();
  const errors = [];
  for (const m of info.messages) {
    const s = `[${label}] ${m.type}: L${m.lineNum}:${m.linePos} ${m.message}`;
    if (m.type === 'error') { dbg(s, true); errors.push(s); }
    else dbg(s);
  }
  if (errors.length === 0) dbg(`[${label}] compiled OK`);
  return errors;
}

// ══════════════════════════════════════════════════════
//  CONFIGURATION — colors swappable here
// ══════════════════════════════════════════════════════
const GRID_W = 256, GRID_H = 256;

const P = {
  lightBlue:[.522,.855,.922], medBlue:[.373,.788,.906], blue:[.373,.631,.906],
  indigo:[.373,.431,.906], darkBlue:[.298,.376,.667], darkIndigo:[.267,.278,.455],
  nearBlack:[.196,.192,.231], darkPurple:[.275,.235,.369], medPurple:[.365,.278,.463],
  purple:[.522,.325,.584], magenta:[.671,.345,.659], pink:[.792,.376,.682],
  peach:[.953,.655,.529], sand:[.961,.855,.655], lightGreen:[.553,.847,.580],
  medGreen:[.365,.757,.565], tealGreen:[.290,.725,.639], darkTeal:[.271,.576,.647],
  brightCyan:[.369,.992,.969], hotPink:[1,.365,.8], brightYellow:[.992,.996,.537],
  white:[1,1,1],
};

const CMAP = {
  empty:[P.nearBlack], sand:[P.sand,P.peach], water:[P.medBlue,P.blue,P.lightBlue],
  stone:[P.darkIndigo,P.darkBlue], fire:[P.brightYellow,P.hotPink,P.pink,P.peach],
  smoke:[P.darkPurple,P.medPurple], plant:[P.medGreen,P.lightGreen,P.tealGreen],
  seed:[P.magenta,P.purple],
  ember:[P.peach,P.pink,P.sand,P.hotPink],
};

function buildColorWGSL() {
  const types = ['empty','sand','water','stone','fire','smoke','plant','seed','ember'];
  const out = [];
  for (const t of types) {
    const cols = CMAP[t];
    for (let v = 0; v < 4; v++) {
      const c = cols[v % cols.length];
      out.push(`vec3f(${c[0].toFixed(3)}, ${c[1].toFixed(3)}, ${c[2].toFixed(3)})`);
    }
  }
  return out;
}

function jsHash(x) { x=((x>>16)^x)*0x45d9f3b; x=((x>>16)^x)*0x45d9f3b; x=(x>>16)^x; return x>>>0; }
function makeCell(t,d,v) { return (t&0xFF)|((d&0xFF)<<8)|((v&0xFF)<<16); }

// ══════════════════════════════════════════════════════
//  WGSL SHADERS
//  Note: ALL arithmetic uses u32 exclusively.
//  Margolus block origin computed with unsigned math only.
//  No signed shifts, no reserved keywords as identifiers.
// ══════════════════════════════════════════════════════
const CE = buildColorWGSL();

const simWGSL = `
struct Params { w:u32, h:u32, phase:u32, frame:u32, react:u32, _p1:u32, _p2:u32, _p3:u32 }
@group(0) @binding(0) var<storage,read> gi: array<u32>;
@group(0) @binding(1) var<storage,read_write> go: array<u32>;
@group(0) @binding(2) var<uniform> p: Params;

fn idx(x:u32, y:u32) -> u32 { return y * p.w + x; }
fn gt(c:u32) -> u32 { return c & 255u; }
fn gd(c:u32) -> u32 { return (c >> 8u) & 255u; }
fn gv(c:u32) -> u32 { return (c >> 16u) & 255u; }
fn mc(t:u32, d:u32, v:u32) -> u32 { return t | (d << 8u) | (v << 16u); }

fn hh(xi:u32) -> u32 {
  var h = xi;
  h = h ^ (h >> 16u);
  h = h * 0x45d9f3bu;
  h = h ^ (h >> 16u);
  h = h * 0x45d9f3bu;
  h = h ^ (h >> 16u);
  return h;
}

// ─── NOISE ───
fn sstep(a:f32, b:f32, t:f32) -> f32 {
  let x = clamp((t - a) / (b - a), 0.0, 1.0);
  return x * x * (3.0 - 2.0 * x);
}
fn hash_f(ix:u32, iy:u32, seed:u32) -> f32 {
  return f32(hh(ix * 374761393u + iy * 668265263u + seed) & 0xFFFFu) / 65535.0;
}
fn value_noise(fx:f32, fy:f32, period:f32, seed:u32) -> f32 {
  let px = fx / period;
  let py = fy / period;
  let ix0 = u32(floor(px)) & 0xFFu;
  let iy0 = u32(floor(py)) & 0xFFu;
  let ix1 = (ix0 + 1u) & 0xFFu;
  let iy1 = (iy0 + 1u) & 0xFFu;
  let tx = sstep(0.0, 1.0, fract(px));
  let ty = sstep(0.0, 1.0, fract(py));
  return mix(mix(hash_f(ix0,iy0,seed), hash_f(ix1,iy0,seed), tx),
             mix(hash_f(ix0,iy1,seed), hash_f(ix1,iy1,seed), tx), ty);
}
fn growth_noise(cx:u32, cy:u32) -> f32 {
  let fx = f32(cx); let fy = f32(cy);
  return 0.67 * value_noise(fx, fy, 24.0, 12345u)
       + 0.33 * value_noise(fx, fy, 10.0, 67890u);
}
fn noise_variant(cx:u32, cy:u32) -> u32 {
  let n = growth_noise(cx, cy);
  if (n > 0.66) { return 1u; }
  if (n > 0.33) { return 0u; }
  return 2u;
}

// ─── HELPERS ───
fn fl(c:u32) -> bool { let t = gt(c); return t == 1u || t == 2u || t == 7u; }
fn em(c:u32) -> bool { return gt(c) == 0u; }
fn lq(c:u32) -> bool { return gt(c) == 2u; }
fn is_fire(c:u32) -> bool { return gt(c) == 4u; }
fn disp(mover:u32, dest:u32) -> bool {
  if (em(dest)) { return true; }
  return (gt(mover) == 1u || gt(mover) == 7u) && gt(dest) == 2u;
}
fn rises(c:u32) -> bool { return gt(c) == 5u; }
fn burns(c:u32) -> bool { let t = gt(c); return t == 6u || t == 7u; }
fn sw(cells: ptr<function, array<u32, 4>>, a:u32, b:u32) {
  let tmp = (*cells)[a]; (*cells)[a] = (*cells)[b]; (*cells)[b] = tmp;
}
fn cell_x(bx:u32, li:u32) -> u32 { return bx + (li & 1u); }
fn cell_y(by:u32, li:u32) -> u32 { return by + (li >> 1u); }

// ─── CONSTANTS ───
const GERM_E:u32 = 150u;
const WATER_GAIN:u32 = 50u;
const ABSORB_CAP:u32 = 220u;   // raised: let roots get very pressurized
const PUMP_THRESH:u32 = 80u;   // plants above this push energy outward
const PUMP_RATE:u32 = 12u;     // energy pushed per step (constant flow)
const GROW_COST_MIN:u32 = 35u; // cost at noise=1.0 (lowered)
const GROW_COST_MAX:u32 = 100u;// cost at noise=0.0 (lowered)
const CHILD_DIV:u32 = 2u;      // child energy = parent/2
const MIN_CHILD_E:u32 = 12u;   // minimum viable child energy
const FIRE_RISE_COST:u32 = 4u; // extra lifetime lost when fire rises
const SMOKE_TRAIL_LIFE:u32 = 18u; // lifetime of smoke left by rising fire

@compute @workgroup_size(16, 16)
fn main(@builtin(global_invocation_id) gid: vec3u) {
  let x = gid.x;
  let y = gid.y;
  if (x >= p.w || y >= p.h) { return; }

  let ph = p.phase & 1u;
  if (ph == 1u && (x == 0u || y == 0u)) {
    go[idx(x, y)] = gi[idx(x, y)];
    return;
  }

  let bx = ((x - ph) / 2u) * 2u + ph;
  let by = ((y - ph) / 2u) * 2u + ph;
  if (bx + 1u >= p.w || by + 1u >= p.h) {
    go[idx(x, y)] = gi[idx(x, y)];
    return;
  }

  let lx = x - bx;
  let ly = y - by;
  let pos = ly * 2u + lx;

  var c: array<u32, 4>;
  c[0] = gi[idx(bx,      by     )];
  c[1] = gi[idx(bx + 1u, by     )];
  c[2] = gi[idx(bx,      by + 1u)];
  c[3] = gi[idx(bx + 1u, by + 1u)];

  let rng = hh(bx * 65537u + by * 251u + p.frame * 31u);
  // Secondary rng for probability gates (uncorrelated bits)
  let rng2 = hh(bx * 31u + by * 65537u + p.frame * 7919u);

  // ═══════════════════════════════════════════
  //  PHASE 1: MOVEMENT
  // ═══════════════════════════════════════════

  // Gravity straight
  if (fl(c[0]) && disp(c[0], c[2])) { sw(&c, 0u, 2u); }
  if (fl(c[1]) && disp(c[1], c[3])) { sw(&c, 1u, 3u); }

  // Gravity diagonal
  if ((rng & 1u) == 0u) {
    if (fl(c[0]) && !disp(c[0], c[2]) && disp(c[0], c[3]) && !fl(c[1])) { sw(&c, 0u, 3u); }
    if (fl(c[1]) && !disp(c[1], c[3]) && disp(c[1], c[2]) && !fl(c[0])) { sw(&c, 1u, 2u); }
  } else {
    if (fl(c[1]) && !disp(c[1], c[3]) && disp(c[1], c[2]) && !fl(c[0])) { sw(&c, 1u, 2u); }
    if (fl(c[0]) && !disp(c[0], c[2]) && disp(c[0], c[3]) && !fl(c[1])) { sw(&c, 0u, 3u); }
  }

  // Smoke rises
  if (rises(c[2]) && em(c[0])) { sw(&c, 2u, 0u); }
  if (rises(c[3]) && em(c[1])) { sw(&c, 3u, 1u); }
  if (rises(c[2]) && !em(c[0]) && em(c[1]) && ((rng >> 2u) & 1u) == 0u) { sw(&c, 2u, 1u); }
  if (rises(c[3]) && !em(c[1]) && em(c[0]) && ((rng >> 3u) & 1u) == 0u) { sw(&c, 3u, 0u); }

  // Water lateral spread
  let sd = (rng >> 4u) & 1u;
  if (lq(c[2]) && em(c[3]) && sd == 0u)      { sw(&c, 2u, 3u); }
  else if (lq(c[3]) && em(c[2]) && sd == 1u)  { sw(&c, 3u, 2u); }
  if (lq(c[0]) && em(c[1]) && sd == 1u)       { sw(&c, 0u, 1u); }
  else if (lq(c[1]) && em(c[0]) && sd == 0u)  { sw(&c, 1u, 0u); }

  // Water leveling: surface water with water below spreads to empty beside it
  // This simulates hydrostatic pressure pushing the pool surface outward
  if (lq(c[0]) && lq(c[2]) && em(c[1]) && !lq(c[3]) && sd == 0u) {
    sw(&c, 0u, 1u); // TL water spreads right when sitting on water
  } else if (lq(c[1]) && lq(c[3]) && em(c[0]) && !lq(c[2]) && sd == 1u) {
    sw(&c, 1u, 0u); // TR water spreads left when sitting on water
  }

  // Water rising: water in bottom row rises to empty top cell (finding its level)
  // Only when the water can't spread laterally (both bottom cells occupied)
  let rise_bit = (rng >> 6u) & 1u;
  if (lq(c[2]) && lq(c[3]) && em(c[0]) && !em(c[1]) && rise_bit == 0u) {
    sw(&c, 2u, 0u); // BL rises to TL
  } else if (lq(c[2]) && lq(c[3]) && em(c[1]) && !em(c[0]) && rise_bit == 1u) {
    sw(&c, 3u, 1u); // BR rises to TR
  }

  // ═══════════════════════════════════════════
  //  PHASE 2: INTERACTIONS (with probability gates)
  // ═══════════════════════════════════════════

  for (var i = 0u; i < 4u; i = i + 1u) {
    let t = gt(c[i]);

    // ─── FIRE: ignite neighbors, decay ───
    if (t == 4u) {
      let life = gd(c[i]);

      // Ignite flammable neighbors (probability gate: 1/react)
      let ignite_roll = (rng2 >> (i * 3u)) % p.react;
      if (ignite_roll == 0u) {
        for (var j = 0u; j < 4u; j = j + 1u) {
          if (j != i && burns(c[j])) {
            let nt = gt(c[j]);
            var fl_life = 0u;
            if (nt == 6u) {
              fl_life = gd(c[j]) / 3u + 20u; // Option C: plant energy → fire life
            } else {
              fl_life = 50u + (hh(bx * 3u + by * 7u + j + p.frame) % 40u);
            }
            c[j] = mc(4u, fl_life, hh(bx + j * 97u + p.frame * 13u) & 3u);
          }
        }
      }

      // Decay
      if (life <= 1u) {
        c[i] = mc(5u, 30u + ((rng >> 8u) % 30u), gv(c[i]));
      } else {
        var fv = 0u;
        if (life < 20u) { fv = 3u; }
        else if (life < 40u) { fv = 2u; }
        else if (life < 60u) { fv = 1u; }
        c[i] = mc(4u, life - 1u, fv);
      }
    }

    // ─── SMOKE: decay ───
    if (t == 5u) {
      let life = gd(c[i]);
      if (life <= 1u) { c[i] = 0u; }
      else { c[i] = mc(5u, life - 1u, gv(c[i])); }
    }

    // ─── SEED: germinate (probability gate: 1/react) ───
    if (t == 7u) {
      let germ_roll = (rng2 >> (8u + i * 2u)) % p.react;
      if (germ_roll == 0u) {
        for (var j = 0u; j < 4u; j = j + 1u) {
          if (j != i && gt(c[j]) == 2u) {
            let cx = cell_x(bx, i);
            let cy = cell_y(by, i);
            c[i] = mc(6u, GERM_E, noise_variant(cx, cy));
            c[j] = 0u;
            break;
          }
        }
      }
    }

    // ─── PLANT: energy-driven growth ───
    if (t == 6u) {
      var energy = gd(c[i]);

      for (var j = 0u; j < 4u; j = j + 1u) {
        if (j == i) { continue; }
        let jt = gt(c[j]);

        // Rule 2: Watering (probability gate: ~1/(react/2))
        if (jt == 2u && energy < ABSORB_CAP) {
          let water_roll = (rng2 >> (16u + i)) % max(p.react / 2u, 2u);
          if (water_roll == 0u) {
            energy = min(energy + WATER_GAIN, 255u);
            c[j] = 0u;
          }
          continue;
        }

        // Rule 3: Pressure pump — energy flows like water through pipes
        // Plants above PUMP_THRESH push a fixed amount to lower neighbors.
        // Creates constant throughput, not equalization that stalls.
        if (jt == 6u) {
          let je = gd(c[j]);
          if (energy > PUMP_THRESH && energy > je) {
            // Push up to PUMP_RATE, but never drop below threshold
            let available = energy - PUMP_THRESH;
            let room = 255u - je;
            var push = min(PUMP_RATE, min(available, room));
            energy = energy - push;
            c[j] = mc(6u, je + push, gv(c[j]));
          }
          continue;
        }

        // Rule 4: Growth — expand into empty cells or incorporate adjacent seeds
        if ((jt == 0u || jt == 7u) && energy > GROW_COST_MIN) {
          let jx = cell_x(bx, j);
          let jy = cell_y(by, j);
          let n = growth_noise(jx, jy);
          let cost = GROW_COST_MIN + u32(f32(GROW_COST_MAX - GROW_COST_MIN) * (1.0 - n));
          let child_e = energy / CHILD_DIV;
          if (energy > cost && child_e >= MIN_CHILD_E) {
            energy = energy - child_e;
            c[j] = mc(6u, child_e, noise_variant(jx, jy));
          }
        }
      }

      // Rule 5: Metabolic cost — very slow drain without water
      // 1/128 chance per step: a plant at energy 80 lasts ~10,000 steps (~55s at 3x)
      // Only truly disconnected plants eventually die
      let metab_roll = (rng2 >> (24u + i)) & 127u;
      if (metab_roll == 0u && energy > 0u) {
        energy = energy - 1u;
      }

      // Death: plants with no energy become empty
      if (energy == 0u) {
        c[i] = 0u;
      } else {
        c[i] = mc(6u, energy, gv(c[i]));
      }
    }

    // ─── EMBER: static, periodically flares up with fire ───
    if (t == 8u) {
      let elife = gd(c[i]);

      // Flare: spawn short-lived fire in an adjacent empty cell (~1/128 per step)
      let flare_roll = hh(bx * 53u + by * 127u + p.frame * 997u + i * 31u) & 127u;
      if (flare_roll == 0u) {
        for (var j = 0u; j < 4u; j = j + 1u) {
          if (j != i && em(c[j])) {
            // Short fire: life 15-25, looks like a spark
            let spark_life = 15u + (hh(bx + j * 97u + p.frame) % 11u);
            c[j] = mc(4u, spark_life, hh(bx * 7u + j + p.frame) & 3u);
            break;
          }
        }
      }

      // Slow decay: 1/128 per step. Lifetime 200 lasts ~25,600 steps (~142s at 3x)
      let edecay = hh(bx * 31u + by * 53u + p.frame * 71u + i * 13u) & 127u;
      if (edecay == 0u && elife > 0u) {
        if (elife <= 1u) {
          c[i] = 0u; // ember burns out
        } else {
          // Variant pulses slowly based on remaining lifetime
          let ev = (elife / 50u) & 3u;
          c[i] = mc(8u, elife - 1u, ev);
        }
      }
    }
  }

  // ═══════════════════════════════════════════
  //  PHASE 3: FIRE CONVECTION (post-interaction)
  //  Fire rises into empty space, leaves smoke trail.
  //  Processed after interactions so fire gets to ignite
  //  neighbors before rising away from fuel.
  // ═══════════════════════════════════════════

  let fire_rng = hh(bx * 997u + by * 127u + p.frame * 53u);

  // Fire rises: BL→TL, BR→TR (50% probability each)
  if (is_fire(c[2]) && em(c[0]) && ((fire_rng & 1u) == 0u)) {
    let fl2 = gd(c[2]);
    if (fl2 > FIRE_RISE_COST + 2u) {
      // Fire moves up with lifetime penalty
      var fv2 = 0u;
      let nl = fl2 - FIRE_RISE_COST;
      if (nl < 20u) { fv2 = 3u; } else if (nl < 40u) { fv2 = 2u; } else if (nl < 60u) { fv2 = 1u; }
      c[0] = mc(4u, nl, fv2);
      // Smoke trail left behind
      c[2] = mc(5u, SMOKE_TRAIL_LIFE, gv(c[2]));
    }
  }
  if (is_fire(c[3]) && em(c[1]) && ((fire_rng >> 1u) & 1u) == 0u) {
    let fl3 = gd(c[3]);
    if (fl3 > FIRE_RISE_COST + 2u) {
      var fv3 = 0u;
      let nl3 = fl3 - FIRE_RISE_COST;
      if (nl3 < 20u) { fv3 = 3u; } else if (nl3 < 40u) { fv3 = 2u; } else if (nl3 < 60u) { fv3 = 1u; }
      c[1] = mc(4u, nl3, fv3);
      c[3] = mc(5u, SMOKE_TRAIL_LIFE, gv(c[3]));
    }
  }

  // Fire diagonal rise (when straight up blocked, 25% chance)
  if (is_fire(c[2]) && !em(c[0]) && em(c[1]) && ((fire_rng >> 2u) & 3u) == 0u) {
    let fl2d = gd(c[2]);
    if (fl2d > FIRE_RISE_COST + 2u) {
      var fv2d = 0u;
      let nl2d = fl2d - FIRE_RISE_COST;
      if (nl2d < 20u) { fv2d = 3u; } else if (nl2d < 40u) { fv2d = 2u; } else if (nl2d < 60u) { fv2d = 1u; }
      c[1] = mc(4u, nl2d, fv2d);
      c[2] = mc(5u, SMOKE_TRAIL_LIFE, gv(c[2]));
    }
  }
  if (is_fire(c[3]) && !em(c[1]) && em(c[0]) && ((fire_rng >> 4u) & 3u) == 0u) {
    let fl3d = gd(c[3]);
    if (fl3d > FIRE_RISE_COST + 2u) {
      var fv3d = 0u;
      let nl3d = fl3d - FIRE_RISE_COST;
      if (nl3d < 20u) { fv3d = 3u; } else if (nl3d < 40u) { fv3d = 2u; } else if (nl3d < 60u) { fv3d = 1u; }
      c[0] = mc(4u, nl3d, fv3d);
      c[3] = mc(5u, SMOKE_TRAIL_LIFE, gv(c[3]));
    }
  }

  // Fire lateral drift (top row only — fire that's already airborne, 25% chance)
  let drift_dir = (fire_rng >> 6u) & 1u;
  if (is_fire(c[0]) && em(c[1]) && drift_dir == 0u && ((fire_rng >> 7u) & 3u) == 0u) {
    sw(&c, 0u, 1u); // pure swap, no lifetime cost for lateral
  } else if (is_fire(c[1]) && em(c[0]) && drift_dir == 1u && ((fire_rng >> 7u) & 3u) == 0u) {
    sw(&c, 1u, 0u);
  }

  go[idx(x, y)] = c[pos];
}
`;

const renWGSL = `
struct Params { w:u32, h:u32, phase:u32, frame:u32, react:u32, _p1:u32, _p2:u32, _p3:u32 }
struct V { @builtin(position) pos: vec4f, @location(0) uv: vec2f }

@group(0) @binding(0) var<storage,read> grid: array<u32>;
@group(0) @binding(1) var<uniform> p: Params;

@vertex fn vs(@builtin(vertex_index) vi: u32) -> V {
  var o: V;
  let x = f32(i32(vi & 1u)) * 4.0 - 1.0;
  let y = f32(i32(vi >> 1u)) * 4.0 - 1.0;
  o.pos = vec4f(x, y, 0.0, 1.0);
  o.uv = vec2f((x + 1.0) * 0.5, (1.0 - y) * 0.5);
  return o;
}

fn gt(c:u32) -> u32 { return c & 255u; }
fn gd(c:u32) -> u32 { return (c >> 8u) & 255u; }
fn gv(c:u32) -> u32 { return (c >> 16u) & 255u; }

fn gc(cell: u32) -> vec3f {
  let t = gt(cell);
  let v = gv(cell);
  let ti = t * 4u + (v & 3u);
  var cl = array<vec3f, 36>(
    ${CE.join(',\n    ')}
  );
  if (ti < 36u) { return cl[ti]; }
  return vec3f(1.0, 0.0, 1.0);
}

@fragment fn fs(inp: V) -> @location(0) vec4f {
  let gx = u32(inp.uv.x * f32(p.w));
  let gy = u32(inp.uv.y * f32(p.h));
  if (gx >= p.w || gy >= p.h) { return vec4f(0.196, 0.192, 0.231, 1.0); }

  let cell = grid[gy * p.w + gx];
  var col = gc(cell);

  // Fire glow
  if (gt(cell) == 4u) {
    col = col * (1.0 + f32(gd(cell)) / 200.0);
  }
  // Ember glow: gentle pulse
  if (gt(cell) == 8u) {
    col = col * (0.8 + 0.4 * f32(gd(cell)) / 200.0);
  }

  // CRT effects
  let sl = 0.88 + 0.12 * f32(u32(inp.pos.y) & 1u);
  let uc = (inp.uv - 0.5) * 2.0;
  let vig = 1.0 - 0.25 * dot(uc, uc);
  col = col * vec3f(1.02, 1.0, 0.98) * sl * vig;

  return vec4f(col, 1.0);
}
`;


// ══════════════════════════════════════════════════════
//  MAIN
// ══════════════════════════════════════════════════════
async function main() {
  dbg('Init...');

  if (!navigator.gpu) {
    document.getElementById('error').style.display = 'block';
    dbg('No WebGPU', true);
    return;
  }

  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) {
    document.getElementById('error').style.display = 'block';
    dbg('No adapter', true);
    return;
  }
  dbg(`Adapter: ${adapter.info?.vendor || 'unknown'} ${adapter.info?.device || ''}`);

  const device = await adapter.requestDevice();
  device.addEventListener('uncapturederror', e => dbg(`GPU ERR: ${e.error.message}`, true));
  device.lost.then(i => dbg(`DEVICE LOST: ${i.message}`, true));

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('webgpu');
  if (!ctx) { dbg('No WebGPU context', true); return; }
  const fmt = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format: fmt, alphaMode: 'opaque' });
  document.getElementById('app').style.display = 'flex';
  dbg(`Canvas: ${fmt}`);

  // ── Pre-validate WGSL before compilation ──
  dbg('Running WGSL pre-validation...');
  const simLint = validateWGSL(simWGSL, 'sim');
  const renLint = validateWGSL(renWGSL, 'render');

  const N = GRID_W * GRID_H, NB = N * 4;
  const gA = device.createBuffer({ size: NB, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const gB = device.createBuffer({ size: NB, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const empty = new Uint32Array(N);

  const spD = new Uint32Array([GRID_W, GRID_H, 0, 0, 8, 0, 0, 0]); // w,h,phase,frame,react,pad,pad,pad
  const spB = device.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(spB, 0, spD);

  // ── Compile shaders ──
  dbg('Compiling shaders...');
  const simMod = device.createShaderModule({ code: simWGSL });
  const simErrors = await checkShader(device, simMod, 'sim');
  const renMod = device.createShaderModule({ code: renWGSL });
  const renErrors = await checkShader(device, renMod, 'render');

  // ── Build sim pipeline ──
  const sBGL = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
    { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
    { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
  ]});

  let simPipe = null;
  if (simErrors.length === 0) {
    try {
      simPipe = await device.createComputePipelineAsync({
        layout: device.createPipelineLayout({ bindGroupLayouts: [sBGL] }),
        compute: { module: simMod, entryPoint: 'main' },
      });
      dbg('Sim pipeline OK');
    } catch (e) {
      dbg(`Sim pipeline FAIL: ${e.message}`, true);
    }
  } else {
    dbg('Skipping sim pipeline creation — shader has errors', true);
  }

  // Update health indicators
  setHealth('h-sim', !!simPipe);
  if (!simPipe) {
    showSimError(simErrors.length > 0 ? simErrors : ['Pipeline creation failed']);
  }

  const sBGs = [
    device.createBindGroup({ layout: sBGL, entries: [
      { binding: 0, resource: { buffer: gA } }, { binding: 1, resource: { buffer: gB } }, { binding: 2, resource: { buffer: spB } },
    ]}),
    device.createBindGroup({ layout: sBGL, entries: [
      { binding: 0, resource: { buffer: gB } }, { binding: 1, resource: { buffer: gA } }, { binding: 2, resource: { buffer: spB } },
    ]}),
  ];

  // ── Build render pipeline ──
  let renPipe = null;
  const rBGL = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'read-only-storage' } },
    { binding: 1, visibility: GPUShaderStage.FRAGMENT | GPUShaderStage.VERTEX, buffer: { type: 'uniform' } },
  ]});

  if (renErrors.length === 0) {
    try {
      renPipe = device.createRenderPipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [rBGL] }),
        vertex: { module: renMod, entryPoint: 'vs' },
        fragment: { module: renMod, entryPoint: 'fs', targets: [{ format: fmt }] },
        primitive: { topology: 'triangle-list' },
      });
      dbg('Render pipeline OK');
    } catch (e) {
      dbg(`Render pipeline FAIL: ${e.message}`, true);
    }
  }
  setHealth('h-ren', !!renPipe);

  if (!renPipe) {
    dbg('FATAL: render pipeline failed — nothing to display', true);
    return;
  }

  const rBGs = [
    device.createBindGroup({ layout: rBGL, entries: [
      { binding: 0, resource: { buffer: gA } }, { binding: 1, resource: { buffer: spB } },
    ]}),
    device.createBindGroup({ layout: rBGL, entries: [
      { binding: 0, resource: { buffer: gB } }, { binding: 1, resource: { buffer: spB } },
    ]}),
  ];

  const grids = [gA, gB];

  // ── Test pattern ──
  dbg('Writing test pattern...');
  const tg = new Uint32Array(N);
  for (let x = 80; x < 176; x++) tg[30 * GRID_W + x] = makeCell(1, 0, x & 3);
  for (let x = 100; x < 156; x++) for (let y = 35; y < 40; y++) tg[y * GRID_W + x] = makeCell(2, 0, x & 3);
  for (let x = 60; x < 196; x++) tg[200 * GRID_W + x] = makeCell(3, 0, x & 1);
  for (let x = 110; x < 120; x++) tg[32 * GRID_W + x] = makeCell(7, 0, x & 3);
  device.queue.writeBuffer(gA, 0, tg);
  device.queue.writeBuffer(gB, 0, tg);
  dbg('Test pattern ready — you should see sand, water, stone, seeds');

  // ── State ──
  let cur = 0, step = 0, paused = false, selType = 1, bRad = 3, spf = 3, reactRate = 8;
  let pDown = false, pGrid = null, pEvts = 0;

  // ── CPU Brush ──
  function cpuBrush(gx, gy, r, type, buf) {
    for (let dy = -r; dy <= r; dy++) {
      const py = gy + dy;
      if (py < 0 || py >= GRID_H) continue;
      const hw = Math.floor(Math.sqrt(r * r - dy * dy));
      const x0 = Math.max(0, gx - hw), x1 = Math.min(GRID_W - 1, gx + hw);
      if (x0 > x1) continue;
      const row = new Uint32Array(x1 - x0 + 1);
      for (let i = 0; i < row.length; i++) {
        const px = x0 + i;
        if (type === 0) { row[i] = 0; continue; }
        const v = jsHash(px * 65537 + py * 251 + step) & 3;
        let d = 0;
        if (type === 4) d = 60 + (jsHash(px + py * 97 + step) % 40); // fire: user-drawn fixed lifetime
        if (type === 6) d = 150; // plant: starting energy = GERM_E
        if (type === 8) d = 200; // ember: long lifetime
        row[i] = makeCell(type, d, v);
      }
      device.queue.writeBuffer(buf, (py * GRID_W + x0) * 4, row);
    }
  }

  // ── Pointer ──
  function c2g(e) {
    const r = canvas.getBoundingClientRect();
    const sx = (e.clientX - r.left) / r.width, sy = (e.clientY - r.top) / r.height;
    return [
      Math.max(0, Math.min(GRID_W - 1, Math.floor(sx * GRID_W))),
      Math.max(0, Math.min(GRID_H - 1, Math.floor(sy * GRID_H)))
    ];
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    pDown = true; pGrid = c2g(e); pEvts++;
    dbg(`DOWN (${pGrid[0]},${pGrid[1]}) t=${selType} r=${bRad}`);
  }, { passive: false });

  canvas.addEventListener('pointermove', e => {
    e.preventDefault();
    if (!pDown) return;
    pGrid = c2g(e); pEvts++;
  }, { passive: false });

  canvas.addEventListener('pointerup', e => { e.preventDefault(); pDown = false; dbg('UP'); }, { passive: false });
  canvas.addEventListener('pointercancel', () => { pDown = false; dbg('CANCEL'); });
  canvas.addEventListener('touchstart', e => { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });

  // ── Toolbar ──
  document.querySelectorAll('.particle-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.particle-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      selType = parseInt(b.dataset.type);
      dbg(`Type → ${selType}`);
    });
  });
  document.getElementById('brush-size').addEventListener('input', e => { bRad = parseInt(e.target.value); });
  document.getElementById('sim-speed').addEventListener('input', e => { spf = parseInt(e.target.value); });
  document.getElementById('react-rate').addEventListener('input', e => {
    reactRate = parseInt(e.target.value);
    dbg(`React → ${reactRate}`);
  });
  document.getElementById('btn-pause').addEventListener('click', () => {
    paused = !paused;
    document.getElementById('btn-pause').textContent = paused ? '▶' : '⏸';
    dbg(paused ? 'PAUSED' : 'RESUMED');
  });
  document.getElementById('btn-clear').addEventListener('click', () => {
    device.queue.writeBuffer(gA, 0, empty);
    device.queue.writeBuffer(gB, 0, empty);
    cur = 0; step = 0;
    dbg('Cleared');
  });

  // ── Render Loop ──
  const dX = Math.ceil(GRID_W / 16), dY = Math.ceil(GRID_H / 16);
  let fc = 0, lt = performance.now();
  const stEl = document.getElementById('status');

  function frame() {
    fc++;
    const now = performance.now();
    if (now - lt >= 1000) {
      const sim = simPipe ? '●' : '○';
      const pi = pDown ? ` ptr(${pGrid?.[0]},${pGrid?.[1]})` : '';
      stEl.textContent = `${fc}fps ${sim}step:${step} ${spf}x r:1/${reactRate}${pi} evts:${pEvts}`;
      fc = 0; lt = now;
    }

    // Brush
    if (pDown && pGrid) {
      cpuBrush(pGrid[0], pGrid[1], bRad, selType, grids[cur]);
    }

    // Sim
    if (!paused && simPipe) {
      for (let s = 0; s < spf; s++) {
        spD[2] = step & 1;
        spD[3] = step;
        spD[4] = reactRate;
        device.queue.writeBuffer(spB, 0, spD);
        const enc = device.createCommandEncoder();
        const cp = enc.beginComputePass();
        cp.setPipeline(simPipe);
        cp.setBindGroup(0, sBGs[cur]);
        cp.dispatchWorkgroups(dX, dY);
        cp.end();
        device.queue.submit([enc.finish()]);
        cur = 1 - cur;
        step++;
      }
    }

    // Render
    spD[2] = step & 1;
    spD[3] = step;
    spD[4] = reactRate;
    device.queue.writeBuffer(spB, 0, spD);
    const enc = device.createCommandEncoder();
    const rp = enc.beginRenderPass({ colorAttachments: [{
      view: ctx.getCurrentTexture().createView(),
      loadOp: 'clear', storeOp: 'store',
      clearValue: { r: 0.196, g: 0.192, b: 0.231, a: 1.0 },
    }]});
    rp.setPipeline(renPipe);
    rp.setBindGroup(0, rBGs[cur]);
    rp.draw(3);
    rp.end();
    device.queue.submit([enc.finish()]);
    requestAnimationFrame(frame);
  }

  dbg('Starting loop...');
  requestAnimationFrame(frame);
}

main().catch(err => {
  dbg(`FATAL: ${err.message}\n${err.stack}`, true);
  document.getElementById('error').style.display = 'block';
  document.getElementById('error').innerHTML += `<p style="margin-top:1em;font-size:11px;color:#5d4776;word-break:break-all">${err.message}</p>`;
});
</script>
</body>
</html>
